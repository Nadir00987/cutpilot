# CutPilot AI — one-command local deployment
# Usage: cp .env.example .env  &&  docker compose up --build
#
# Services:
#   web      Next.js frontend          -> http://localhost:3000
#   api      FastAPI backend           -> http://localhost:8000 (docs at /docs)
#   worker   Celery render/AI worker   (same image as api, celery entrypoint)
#   postgres PostgreSQL 16            -> localhost:5432
#   redis    Redis 7                   -> localhost:6379
#
# NOTE: Docker is not installed on the dev VM; this file is still kept valid
# YAML so it runs unmodified on any machine with Docker. Validate with:
#   python -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"

name: cutpilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: cutpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cutpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cutpilot}
      POSTGRES_DB: ${POSTGRES_DB:-cutpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cutpilot} -d ${POSTGRES_DB:-cutpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cutpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cutpilot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cutpilot}:${POSTGRES_PASSWORD:-cutpilot}@postgres:5432/${POSTGRES_DB:-cutpilot}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/admin/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cutpilot-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cutpilot}:${POSTGRES_PASSWORD:-cutpilot}@postgres:5432/${POSTGRES_DB:-cutpilot}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery", "worker", "--loglevel=info", "--concurrency=1", "-Q", "analysis,render,default"]
    # No ports: workers communicate only over the broker.

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cutpilot-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  storage:
